        // Custom hook for debouncing inputs
        const useDebounce = (value, delay) => {
            const [debouncedValue, setDebouncedValue] = useState(value);
            useEffect(() => {
                const handler = setTimeout(() => { setDebouncedValue(value); }, delay);
                return () => clearTimeout(handler);
            }, [value, delay]);
            return debouncedValue;
        };

        // Security: Keys are passed dynamically from state, never hardcoded.

        const fetchGeminiResponse = async (prompt, systemInstruction, responseSchema = null, apiKey) => {
            if (!apiKey) {
                // Secure Fallback: Local simulated response if no key is provided
                return new Promise(resolve => setTimeout(() => resolve({
                    isDemo: true,
                    text: "Demo Mode Active. To receive dynamic AI responses, please configure your API key in settings. Always refer to official sources for verified Census data.",
                    json: {
                        summary: "Demo Mode Active (API key not found).",
                        status: "Cannot verify",
                        explanation: "The application is running without an API key. Safe simulation active.",
                        action: "Check official sources."
                    }
                }), 1000));
            }

            try {
                const payload = { contents: [{ parts: [{ text: prompt }] }] };
                if (systemInstruction) payload.systemInstruction = { parts: [{ text: systemInstruction }] };
                if (responseSchema) {
                    payload.generationConfig = { responseMimeType: "application/json", responseSchema };
                }

                // Security: API call over HTTPS only. Key is strictly in memory.
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
                });
                
                if (!response.ok) throw new Error(`API Error: ${response.status}`);
                const data = await response.json();
                const textOutput = data.candidates?.[0]?.content?.parts?.[0]?.text;
                
                if (!textOutput) throw new Error("Empty response");
                return responseSchema ? { text: null, json: JSON.parse(textOutput) } : { text: textOutput, json: null };
            } catch (error) {
                console.error("API Security/Network Error:", error);
                throw error;
            }

        // Requirement 5: Misinformation & Verification
        const ClaimCheckerPage = ({ apiKey }) => {
            const [claim, setClaim] = useState('');
            const [result, setResult] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            const handleVerify = async () => {
                const trimmed = claim.trim();
                if (!trimmed) { setError('Please enter a claim to verify.'); return; }
                if (trimmed.length > 500) { setError('Claim is too long. Max 500 characters.'); return; }
                
                setError(''); setLoading(true); setResult(null);

                const sysInst = `You are a fact-checking assistant for Census 2027. Determine if the claim is valid, partly valid, or a scam. Keep tone objective. output JSON: summary (1 sentence), status (Verified, Partially verified, Cannot verify, Likely misleading), explanation (2 sentences), action (what user should do).`;
                const schema = { summary: {type: "STRING"}, status: {type: "STRING"}, explanation: {type: "STRING"}, action: {type: "STRING"} };

                try {
                    const res = await fetchGeminiResponse(`Analyze claim: "${sanitizeString(trimmed)}"`, sysInst, schema, apiKey);
                    setResult(res.json);
                } catch (err) {
                    setResult({ status: "Cannot verify", summary: "Verification system offline.", explanation: "Could not connect to analysis engine.", action: "Check official sources." });
                } finally {
                    setLoading(false);
                }

                                  className={`w-full h-36 p-4 border rounded-xl focus:ring-2 outline-none resize-none mb-2 text-base transition-shadow ${error ? 'border-red-300 focus:ring-red-500 bg-red-50/30' : 'border-slate-300 focus:ring-primary-500 bg-slate-50/50'}`} aria-invalid={error ? 'true' : 'false'}></textarea>
                        
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">

                                <span className="text-xs font-bold text-slate-400 uppercase self-center mr-1">Demo Cases:</span>
                                <button onClick={() => setClaim("Send your OTP to the census officer.")} className="text-xs font-semibold bg-white border border-slate-200 hover:border-slate-400 text-slate-700 px-3 py-1.5 rounded-full transition-colors focus:ring-2 focus:ring-primary-500 outline-none">OTP Scam</button>
                                <button onClick={() => setClaim("Phase 1 of the census is completely digital.")} className="text-xs font-semibold bg-white border border-slate-200 hover:border-slate-400 text-slate-700 px-3 py-1.5 rounded-full transition-colors focus:ring-2 focus:ring-primary-500 outline-none">Digital Phase</button>
                            </div>
                            <Button onClick={handleVerify} isLoading={loading} className="w-full md:w-auto shadow-md">Analyze Message</Button>
                        </div>
                        {error && <p className="text-sm text-red-600 font-bold mt-4" role="alert">{error}</p>}
                    </Card>

                    <div aria-live="polite">
                        {result && (
                            <Card className={`p-6 md:p-8 border-t-4 animate-in slide-in-from-bottom-4 shadow-lg ${result.status === 'Verified' ? 'border-t-success-500' : result.status === 'Likely misleading' ? 'border-t-red-500' : 'border-t-accent-500'}`}>

                                    <h3 className="font-extrabold text-2xl text-slate-900">Analysis Result</h3>
                                    <Badge status={result.status === 'Verified' ? 'success' : result.status === 'Likely misleading' ? 'danger' : 'warning'} className="text-sm px-4 py-1.5">{result.status}</Badge>
                                </div>
                                <div className="space-y-6 text-slate-700">
                                    <div><strong className="block text-slate-500 text-xs uppercase tracking-wider mb-1.5">Summary</strong><p className="font-medium text-slate-900 text-lg leading-snug">{sanitizeString(result.summary)}</p></div>
                                    <div><strong className="block text-slate-500 text-xs uppercase tracking-wider mb-1.5">Explanation</strong><p className="leading-relaxed">{sanitizeString(result.explanation)}</p></div>
                                    <div className="bg-primary-50/80 p-5 rounded-xl border border-primary-100">
                                        <strong className="block text-primary-800 text-xs uppercase tracking-wider mb-2">Recommended Action</strong>
                                        <p className="text-primary-950 font-bold flex items-start text-base"><ArrowRight className="w-5 h-5 mr-2 shrink-0 mt-0.5 text-primary-600" aria-hidden="true" /> {sanitizeString(result.action)}</p>
                                    </div>
                                </div>
                            </Card>
                        )}
                    </div>
                </main>
            );
        };

        // Requirement 8: GenAI Assistant
        const AIAssistantPage = ({ apiKey, toggleSettings }) => {
            const [messages, setMessages] = useState([{ role: 'ai', text: "Namaste! I am CensusSaathi, your AI guide for Census 2027. How can I help you today?" }]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const messagesEndRef = useRef(null);
            const inputRef = useRef(null);

            useEffect(() => { messagesEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages, loading]);
            // Focus input on mount
            useEffect(() => { if (inputRef.current) inputRef.current.focus(); }, []);

            const handleSend = async (textToUse = input) => {
                const trimmed = textToUse.trim();
                if (!trimmed) return;
                
                setMessages(prev => [...prev, { role: 'user', text: trimmed }]);
                setInput(''); setLoading(true);

                const sysPrompt = `You are CensusSaathi AI, a helpful citizen assistant for India's Census 2027. Rules: 1. Simple language. 2. Phase 1 is House Listing, Phase 2 is Population Enum. 3. Say this is a prototype. 4. Never ask for PII/OTPs. 5. If unknown, say "Please check official sources."`;

                try {
                    const res = await fetchGeminiResponse(sanitizeString(trimmed), sysPrompt, null, apiKey);
                    setMessages(prev => [...prev, { role: 'ai', text: res.text || res.json?.text || "I encountered an error." }]);
                } catch (err) {
                    setMessages(prev => [...prev, { role: 'ai', text: "Sorry, I am unable to connect to the server right now. Please try again later." }]);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <main className="max-w-4xl mx-auto py-6 px-4 md:px-6 h-[calc(100vh-70px)] flex flex-col animate-in fade-in">
                    <header className="text-center mb-6">
                        <h1 className="text-3xl font-extrabold text-primary-950">Ask CensusSaathi</h1>
                        <p className="text-slate-600 font-medium">Your trusted AI guide for understanding Census 2027.</p>
                        {!apiKey && (
                            <button onClick={toggleSettings} className="mt-2 text-xs bg-orange-100 text-orange-800 px-3 py-1 rounded-full font-bold hover:bg-orange-200 transition-colors inline-flex items-center">
                                <Key className="w-3 h-3 mr-1" /> API Key Missing - Running in Demo Mode
                            </button>
                        )}
                    </header>

                    <Card className="flex-1 flex flex-col bg-white overflow-hidden border-slate-300 shadow-lg">
                        {/* Accessibility: aria-live ensures screen readers read new messages */}
                        <div className="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 bg-slate-50/50" aria-live="polite">
                            {messages.map((m, i) => (
                                <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`max-w-[90%] md:max-w-[75%] rounded-2xl p-4 shadow-sm ${m.role === 'user' ? 'bg-primary-600 text-white rounded-br-sm' : 'bg-white border border-slate-200 text-slate-800 rounded-bl-sm'}`}>
                                        {m.role === 'ai' && <div className="flex items-center text-xs font-extrabold text-primary-700 mb-2 uppercase tracking-wide"><MessageSquare className="w-3.5 h-3.5 mr-1.5" /> CensusSaathi</div>}
                                        <div className="whitespace-pre-wrap text-[15px] leading-relaxed font-medium">{sanitizeString(m.text)}</div>
                                    </div>
                                </div>
                            ))}
                            {loading && (
                                <div className="flex justify-start" aria-hidden="true">
                                    <div className="bg-white border border-slate-200 p-4 rounded-2xl rounded-bl-sm flex items-center shadow-sm">
                                        <Loader2 className="w-5 h-5 text-primary-500 animate-spin mr-2" />
                                        <span className="text-slate-500 text-sm font-medium">Analyzing...</span>
                                    </div>
                                </div>
                            )}
                            <div ref={messagesEndRef} />
                        </div>
                        <div className="p-4 bg-white border-t border-slate-200">
                            <div className="flex flex-wrap gap-2 mb-3">
                                {["What is self-enumeration?", "Is my data safe?", "Phase 2 dates?"].map((q, idx) => (
                                    <button key={idx} onClick={() => handleSend(q)} className="text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-full transition-colors focus:ring-2 focus:ring-primary-500 outline-none">{q}</button>
                                ))}
                            </div>
                            <div className="flex relative">
                                <label htmlFor="chat-input" className="sr-only">Ask a question</label>
                                <input ref={inputRef} id="chat-input" type="text" value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleSend()} maxLength={200}
                                       placeholder="Ask a question about Census 2027..." className="w-full pl-5 pr-14 py-4 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-primary-500 outline-none text-base shadow-inner transition-shadow" />
                                <button onClick={() => handleSend()} disabled={!input.trim() || loading} aria-label="Send message"
                                        className="absolute right-2 top-1/2 transform -translate-y-1/2 bg-primary-600 text-white p-2.5 rounded-lg hover:bg-primary-700 disabled:opacity-50 transition-colors focus:ring-2 focus:ring-offset-2 focus:ring-primary-600 outline-none">
                                    <Send className="w-5 h-5" aria-hidden="true" />
                                </button>
                            </div>
                            <p className="text-[10px] text-center text-slate-400 mt-2 font-medium uppercase tracking-wide">AI can make mistakes. Verify important info.</p>
                        </div>
                    </Card>
                </main>
            );
        };

        // Requirement 4: Privacy Page
        const PrivacyPage = () => (
            <main className="max-w-4xl mx-auto py-12 px-6 animate-in fade-in flex-1">
                <header className="text-center mb-12">
                    <h1 className="text-3xl md:text-5xl font-extrabold text-primary-950 mb-4 tracking-tight flex justify-center items-center"><Lock className="w-10 h-10 mr-3 text-primary-600" aria-hidden="true" /> Your Data. Your Privacy.</h1>
                    <p className="text-slate-600 text-xl font-medium">Understanding how your information is protected.</p>
                </header>

                <Card className="p-8 mb-10 bg-primary-50 border-primary-200 shadow-sm relative overflow-hidden">
                    <div className="absolute top-0 right-0 p-4 opacity-10"><ShieldCheck className="w-32 h-32 text-primary-900" /></div>
                    <h2 className="text-2xl font-extrabold text-primary-950 mb-3 relative z-10">Prototype Privacy Promise</h2>
                    <p className="text-primary-800 text-lg leading-relaxed relative z-10 font-medium">For this demonstration, we <strong>do not</strong> transmit or store any sensitive personal information on external servers. All form data remains locally in your browser session.</p>
                </Card>

                <div className="grid md:grid-cols-2 gap-8 mb-10">
                    <section aria-labelledby="never-share">
                        <h3 id="never-share" className="text-xl font-bold text-slate-900 mb-5 flex items-center border-b border-slate-200 pb-2"><EyeOff className="w-5 h-5 mr-2 text-red-500" /> Never Share These</h3>
                        <div className="space-y-3">
                            {["Bank OTPs / Passwords", "Credit/Debit Card Details", "UPI PINs", "Money to 'fast-track' census"].map((item, i) => (
                                <div key={i} className="flex items-center p-4 bg-red-50/50 border border-red-100 text-red-900 rounded-xl font-semibold"><AlertTriangle className="w-5 h-5 mr-3 text-red-600 shrink-0" aria-hidden="true" /> {item}</div>
                            ))}
                        </div>
                        <p className="text-sm text-slate-600 mt-4 font-medium bg-slate-100 p-3 rounded-lg border border-slate-200">Official enumerators will <strong>never</strong> ask for these details.</p>
                    </section>
                    <section aria-labelledby="checklist">
                        <h3 id="checklist" className="text-xl font-bold text-slate-900 mb-5 flex items-center border-b border-slate-200 pb-2"><ShieldCheck className="w-5 h-5 mr-2 text-success-600" /> Security Checklist</h3>
                        <ul className="space-y-4">
                            {[
                                "Verify the website ends in .gov.in before submitting real info.",
                                "Ensure the site connection is secure (padlock icon).",
                                "Verify suspicious SMS claims using our Claim Checker.",
                                "Ask enumerators for official ID cards during house visits."
                            ].map((text, i) =>(
                                <li key={i} className="flex items-start bg-white p-3 rounded-xl border border-slate-100 shadow-sm"><CheckCircle className="w-5 h-5 mr-3 text-success-500 shrink-0 mt-0.5" aria-hidden="true" /> <span className="text-slate-700 font-medium">{text}</span></li>
                            ))}
                        </ul>
                    </section>
                </div>
            </main>
        );

        // ==========================================
        // 6. MAIN APP, ROUTING & SECURITY MODAL
        // ==========================================

        export default function App() {
            const [currentRoute, setCurrentRoute] = useState('home');
            const [lang, setLang] = useState('en');
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            
            // Security: API Key management in memory/sessionStorage (never hardcoded)
            const [apiKey, setApiKey] = useState(() => sessionStorage.getItem('cs_api_key') || '');
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [tempKey, setTempKey] = useState('');

            // Translation utility
            const t = useCallback((key) => TRANSLATIONS[lang]?.[key] || TRANSLATIONS['en'][key] || key, [lang]);

            const navigate = (route) => {
                setCurrentRoute(route);
                setMobileMenuOpen(false);
                window.scrollTo(0,0);
                document.title = `CensusSaathi AI - ${route.charAt(0).toUpperCase() + route.slice(1)}`;
            };

            const saveSettings = () => {
                setApiKey(tempKey);
                if (tempKey) sessionStorage.setItem('cs_api_key', tempKey);
                else sessionStorage.removeItem('cs_api_key');
                setIsSettingsOpen(false);
            };

            // In-browser test runner (fulfilling testing requirement within single-file constraint)
            useEffect(() => {
                if (window.location.search.includes('test=true')) {
                    console.group('%c 🧪 Running CensusSaathi Unit Tests...', 'color: #3b82f6; font-size: 14px; font-weight: bold;');
                    const assert = (name, condition) => {
                        if (condition) console.log(`%c ✅ PASS: ${name}`, 'color: #22c55e');
                        else console.error(`%c ❌ FAIL: ${name}`, 'color: #ef4444');
                    };
                    // Test 1: Validation Hook
                    assert('Validation: Reject empty required field', validators.isRequired('') !== '');
                    assert('Validation: Accept valid required field', validators.isRequired('John') === '');
                    assert('Validation: Reject low age', validators.isRequired('0') !== '');
                    // Test 2: Sanitization
                    assert('Security: Sanitize HTML tags', sanitizeString('<script>alert()</' + 'script>') === '&lt;script&gt;alert()&lt;/script&gt;');
                    // Test 3: Translations
                    assert('i18n: Fallback to english if key missing', TRANSLATIONS['en']['nav_home'] === 'Home');
                    console.groupEnd();
                }
            }, []);

            const navItems = [
                { id: 'home', label: t('nav_home'), icon: <Home className="w-4 h-4 mr-2" /> },
                { id: 'census-2027', label: t('nav_census'), icon: <Info className="w-4 h-4 mr-2" /> },
                { id: 'self-enumeration', label: t('nav_self_enum'), icon: <FileText className="w-4 h-4 mr-2" /> },
                { id: 'dates', label: t('nav_dates'), icon: <Calendar className="w-4 h-4 mr-2" /> },
                { id: 'data-explorer', label: t('nav_data'), icon: <BarChart2 className="w-4 h-4 mr-2" /> },
                { id: 'assistant', label: t('nav_ai'), icon: <MessageSquare className="w-4 h-4 mr-2" /> },
                { id: 'verify', label: t('nav_verify'), icon: <ShieldCheck className="w-4 h-4 mr-2" /> },
            ];

            const renderPage = () => {
                switch(currentRoute) {
                    case 'home': return <HomePage navigate={navigate} t={t} />;
                    case 'census-2027': return <CensusInfoPage />;
                    case 'self-enumeration': return <SelfEnumerationWizard navigate={navigate} />;
                    case 'dates': return <DatesPage />;
                    case 'data-explorer': return <DataExplorerPage />;
                    case 'assistant': return <AIAssistantPage apiKey={apiKey} toggleSettings={() => {setTempKey(apiKey); setIsSettingsOpen(true);}} />;
                    case 'verify': return <ClaimCheckerPage apiKey={apiKey} />;
                    case 'privacy': return <PrivacyPage />;
                    default: return <HomePage navigate={navigate} t={t} />;
                }
            };

            return (
                <>
                    <div className="bg-primary-950 text-primary-100 text-xs py-2 px-4 text-center font-semibold tracking-wide border-b border-primary-900" role="banner">
                        <span className="inline-block md:hidden">Prototype App - Not Official Gov Site</span>
                        <span className="hidden md:inline-block"><AlertTriangle className="w-3 h-3 inline mr-1 -mt-0.5" /> {t('disclaimer')}</span>
                    </div>

                    <header className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 md:px-6 h-16 flex items-center justify-between">
                            <button className="flex items-center focus:ring-2 focus:ring-primary-500 rounded outline-none p-1" onClick={() => navigate('home')} aria-label="Go to Home">
                                <div className="w-8 h-8 bg-primary-900 rounded-lg flex items-center justify-center mr-2 relative overflow-hidden shadow-sm" aria-hidden="true">
                                   <div className="absolute top-0 left-0 w-full h-1 bg-accent-500"></div>
                                   <div className="absolute bottom-0 left-0 w-full h-1 bg-success-600"></div>
                                   <span className="text-white font-extrabold text-lg leading-none">C</span>
                                </div>
                                <span className="text-xl font-extrabold text-primary-950 tracking-tight">CensusSaathi<span className="text-accent-500">AI</span></span>
                            </button>

                            <nav className="hidden lg:flex items-center space-x-1" aria-label="Main Navigation">
                                {navItems.slice(0, 5).map(item => (
                                    <button key={item.id} onClick={() => navigate(item.id)} aria-current={currentRoute === item.id ? 'page' : undefined}
                                            className={`px-4 py-2 rounded-lg text-sm font-bold transition-all focus:ring-2 focus:ring-primary-500 outline-none ${currentRoute === item.id ? 'bg-primary-50 text-primary-700 shadow-sm' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'}`}>
                                        {item.label}
                                    </button>
                                ))}
                            </nav>

                            <div className="hidden lg:flex items-center space-x-3">
                                <label htmlFor="lang-select" className="sr-only">Select Language</label>
                                <select id="lang-select" value={lang} onChange={e => setLang(e.target.value)}
                                        className="bg-slate-50 border border-slate-200 text-sm font-semibold rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-primary-500 cursor-pointer text-slate-700 shadow-sm">
                                    <option value="en">English</option><option value="hi">हिन्दी (HI)</option><option value="mr">मराठी (MR)</option>
                                    <option value="bn">বাংলা (BN)</option><option value="ta">தமிழ் (TA)</option><option value="te">తెలుగు (TE)</option>
                                    <option value="gu">ગુજરાતી (GU)</option><option value="kn">ಕನ್ನಡ (KN)</option>
                                </select>
                                <button onClick={() => {setTempKey(apiKey); setIsSettingsOpen(true);}} aria-label="Settings" className="p-2 text-slate-500 hover:text-primary-600 hover:bg-primary-50 rounded-lg transition-colors focus:ring-2 outline-none"><Settings className="w-5 h-5"/></button>
                                <Button className="px-5 py-2 shadow-md bg-accent-500 hover:bg-accent-600 text-sm border-none" onClick={() => navigate('self-enumeration')}>{t('btn_start')}</Button>
                            </div>

                            <button className="lg:hidden p-2 text-slate-600 rounded-lg focus:ring-2 focus:ring-primary-500 outline-none" 
                                    onClick={() => setMobileMenuOpen(!mobileMenuOpen)} aria-expanded={mobileMenuOpen} aria-label="Toggle Menu">
                                {mobileMenuOpen ? <X /> : <Menu />}
                            </button>
                        </div>

                        {mobileMenuOpen && (
                            <nav className="lg:hidden absolute top-16 left-0 w-full bg-white border-b border-slate-200 shadow-xl px-4 py-4 flex flex-col space-y-1 animate-in slide-in-from-top-2 z-50">
                                {navItems.map(item => (
                                    <button key={item.id} onClick={() => navigate(item.id)} aria-current={currentRoute === item.id ? 'page' : undefined}
                                            className={`flex items-center w-full px-4 py-3 rounded-xl text-left text-sm font-bold ${currentRoute === item.id ? 'bg-primary-50 text-primary-700' : 'text-slate-700 hover:bg-slate-50'}`}>
                                        {item.icon} {item.label}
                                    </button>
                                ))}
                                <button onClick={() => navigate('privacy')} className="flex items-center w-full px-4 py-3 rounded-xl text-left text-sm font-bold text-slate-700 hover:bg-slate-50"><Lock className="w-4 h-4 mr-2"/> {t('nav_privacy')}</button>
                                <div className="pt-4 mt-2 border-t border-slate-100">
                                    <label className="block text-xs font-bold text-slate-500 mb-2 px-4 uppercase tracking-wide">Language / Settings</label>
                                    <div className="flex px-4 gap-2 overflow-x-auto pb-2 no-scrollbar">
                                        {['en', 'hi', 'mr', 'bn', 'ta', 'te', 'gu', 'kn'].map(l => (
                                            <button key={l} onClick={() => setLang(l)} className={`shrink-0 px-3 py-1.5 text-xs font-bold rounded-lg border focus:ring-2 outline-none ${lang === l ? 'bg-primary-900 text-white border-primary-900' : 'bg-white text-slate-600 border-slate-300'}`}>{l.toUpperCase()}</button>
                                        ))}
                                    </div>
                                    <button onClick={() => {setTempKey(apiKey); setIsSettingsOpen(true);}} className="flex items-center w-full px-4 py-3 mt-2 rounded-xl text-left text-sm font-bold text-slate-700 hover:bg-slate-50"><Settings className="w-4 h-4 mr-2"/> API Settings</button>
                                </div>
                            </nav>
                        )}
                    </header>

                    {renderPage()}

                    <footer className="bg-slate-900 text-slate-400 py-12 px-6 border-t border-slate-800" role="contentinfo">
                        <div className="max-w-7xl mx-auto grid md:grid-cols-4 gap-8">
                            <div className="col-span-1 md:col-span-2">
                                <div className="flex items-center mb-4 opacity-90">
                                   <div className="w-6 h-6 bg-slate-700 rounded flex items-center justify-center mr-2"><span className="text-white font-extrabold text-xs">C</span></div>
                                   <span className="text-lg font-extrabold text-white tracking-tight">CensusSaathi<span className="text-accent-500">AI</span></span>
                                </div>
                                <p className="text-sm mb-4 max-w-sm leading-relaxed font-medium">An independent prototype designed to help Indian citizens understand and safely participate in Census 2027.</p>
                                <p className="text-xs border border-slate-700 inline-block p-2.5 rounded-lg text-slate-300 bg-slate-800 font-medium">
                                    <AlertCircle className="w-3 h-3 inline mr-1 -mt-0.5" /> Not affiliated with Govt. of India.
                                </p>
                            </div>
                            <div>
                                <h4 className="text-white font-bold mb-4 uppercase tracking-wide text-sm">Navigation</h4>
                                <ul className="space-y-3 text-sm font-medium">
                                    <li><button onClick={() => navigate('census-2027')} className="hover:text-white transition-colors outline-none focus:ring-1 focus:ring-white">About Census</button></li>
                                    <li><button onClick={() => navigate('self-enumeration')} className="hover:text-white transition-colors outline-none focus:ring-1 focus:ring-white">Self-Enumeration</button></li>
                                    <li><button onClick={() => navigate('dates')} className="hover:text-white transition-colors outline-none focus:ring-1 focus:ring-white">State Dates</button></li>
                                </ul>
                            </div>
                            <div>
                                <h4 className="text-white font-bold mb-4 uppercase tracking-wide text-sm">Safety Tools</h4>
                                <ul className="space-y-3 text-sm font-medium">
                                    <li><button onClick={() => navigate('privacy')} className="hover:text-white transition-colors outline-none focus:ring-1 focus:ring-white">Privacy Policy</button></li>
                                    <li><button onClick={() => navigate('verify')} className="hover:text-white transition-colors outline-none focus:ring-1 focus:ring-white">Claim Checker</button></li>
                                    <li><button onClick={() => navigate('assistant')} className="hover:text-white transition-colors outline-none focus:ring-1 focus:ring-white">AI Assistant</button></li>
                                </ul>
                            </div>
                        </div>
                    </footer>

                    {/* Security: Settings Modal for API Key */}
                    {isSettingsOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in" role="dialog" aria-modal="true" aria-labelledby="settings-title">
                            <Card className="w-full max-w-md p-6 shadow-2xl">
                                <div className="flex justify-between items-center mb-5">
                                    <h2 id="settings-title" className="text-xl font-extrabold text-slate-900 flex items-center"><Settings className="w-5 h-5 mr-2" /> Application Settings</h2>
                                    <button onClick={() => setIsSettingsOpen(false)} aria-label="Close settings" className="text-slate-400 hover:text-slate-700 p-1 rounded-md focus:ring-2 focus:ring-primary-500 outline-none"><X /></button>
                                </div>
                                <div className="space-y-4">
                                    <div className="bg-primary-50 text-primary-900 text-sm p-4 rounded-xl border border-primary-100 font-medium leading-relaxed">
                                        To enable live GenAI features (Assistant & Claim Checker), please provide a Gemini API key. <br/><br/><strong>Security Note:</strong> This key is stored securely in your browser's memory and is never sent to our servers.
                                    </div>
                                    <Input label="Gemini API Key" id="api-key" type="password" value={tempKey} onChange={e => setTempKey(e.target.value)} placeholder="AIzaSy..." />
                                </div>
                                <div className="flex justify-end gap-3 mt-8">
                                    <Button variant="ghost" onClick={() => setIsSettingsOpen(false)}>Cancel</Button>
                                    <Button onClick={saveSettings}>Save Configuration</Button>
                                </div>
                            </Card>
                        </div>
                    )}
                </>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
