        const API_KEY = ""; // Enter your Gemini API key here

        const callGeminiText = async (prompt, systemInstruction = "") => {
            if (!API_KEY) {
                // Fallback for demo without API key to prevent crashing
                await new Promise(resolve => setTimeout(resolve, 1000));
                return "Demo Mode: I am CensusSaathi AI. (Note: The API key is not currently configured, so I am providing a mock response to demonstrate the UI. Please check the official government portal for factual data).";
            }

            try {
                const payload = { contents: [{ parts: [{ text: prompt }] }] };
                if (systemInstruction) payload.systemInstruction = { parts: [{ text: systemInstruction }] };
                
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${API_KEY}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
                });
                
                if (!response.ok) throw new Error(`HTTP Error! Status: ${response.status}`);
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, I could not process that request at the moment.";
            } catch (error) {
                console.error("Gemini API Error:", error);
                return "Error connecting to AI Assistant. Please check your network or API key.";
            }
        };

        const callGeminiJSON = async (prompt, systemInstruction, schemaProperties) => {
            if (!API_KEY) {
                // Fallback JSON for demo without API key
                await new Promise(resolve => setTimeout(resolve, 1500));
                return {
                    summary: "Demo Mode Active (API key not found).",
                    status: "Cannot verify",
                    explanation: "The application is currently running in demonstration mode without an active API key. Please connect a valid Gemini API key to enable live fact-checking.",
                    action: "Treat all unverified claims with caution and rely only on official government sources."
                };
            }

            try {
                const payload = {
                    contents: [{ parts: [{ text: prompt }] }],
                    systemInstruction: { parts: [{ text: systemInstruction }] },
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: { type: "OBJECT", properties: schemaProperties }
                    }
                };
                
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${API_KEY}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
                });
                
                if (!response.ok) throw new Error(`HTTP Error! Status: ${response.status}`);
                const data = await response.json();
                const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!text) throw new Error("No text content returned from the API.");
                return JSON.parse(text);
            } catch (error) {
                console.error("Gemini API Error:", error);
                return null;
            }
        };

            return (

        const SimpleBarChart = ({ data, labelKey, valueKey, colorClass = "bg-blue-600" }) => {
            const maxVal = Math.max(...data.map(d => d[valueKey]));

                            </div>

            const updateFormData = (key, val) => setFormData(prev => ({ ...prev, [key]: val }));
            const updateMember = (index, key, val) => {
                const newMembers = [...formData.members];
                newMembers[index] = { ...newMembers[index], [key]: val };

                        <p className="text-slate-600">Your personalized digital census hub.</p>
                    </div>
                    <div className="mt-4 md:mt-0 bg-blue-50 px-4 py-2 rounded-lg border border-blue-100 flex items-center text-sm">
                        <MapPin className="w-4 h-4 text-blue-600 mr-2" /><span className="font-medium text-blue-900 mr-2">Demo Region:</span><span className="text-blue-800">Maharashtra</span>
                    </div>
                </div>
                <div className="grid md:grid-cols-4 gap-6 mb-10">
                    <Card onClick={() => navigate('self-enumeration')} className="p-6 bg-gradient-to-br from-orange-500 to-orange-600 text-white shadow-md hover:-translate-y-1 transition-all group">
                        <FileText className="w-8 h-8 mb-4 opacity-90 group-hover:scale-110 transition-transform" /><h3 className="font-bold text-lg mb-1">Self-Enumeration</h3><p className="text-orange-100 text-sm">Start the guided process</p>
                    </Card>
                    <Card onClick={() => navigate('dates')} className="p-6 hover:-translate-y-1 transition-all group">
                        <Calendar className="w-8 h-8 mb-4 text-blue-600 opacity-90 group-hover:scale-110 transition-transform" /><h3 className="font-bold text-lg mb-1 text-slate-800">Check Dates</h3><p className="text-slate-500 text-sm">View your state schedule</p>
                    </Card>
                    <Card onClick={() => navigate('assistant')} className="p-6 hover:-translate-y-1 transition-all group">
                        <MessageSquare className="w-8 h-8 mb-4 text-green-600 opacity-90 group-hover:scale-110 transition-transform" /><h3 className="font-bold text-lg mb-1 text-slate-800">Ask CensusSaathi</h3><p className="text-slate-500 text-sm">Get instant answers via AI</p>
                    </Card>
                    <Card onClick={() => navigate('verify')} className="p-6 hover:-translate-y-1 transition-all group">
                        <ShieldCheck className="w-8 h-8 mb-4 text-purple-600 opacity-90 group-hover:scale-110 transition-transform" /><h3 className="font-bold text-lg mb-1 text-slate-800">Verify a Message</h3><p className="text-slate-500 text-sm">Check suspicious claims</p>
                    </Card>
                </div>
                <h2 className="text-xl font-bold text-slate-800 mb-6">Your Census Journey</h2>
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-8 mb-8">
                    <div className="flex flex-col md:flex-row justify-between items-center relative">
                        <div className="hidden md:block absolute top-1/2 left-0 w-full h-1 bg-slate-100 -z-10 transform -translate-y-1/2"></div>
                        {[
                            { label: "Learn", active: true }, { label: "Check Schedule", active: true },
                            { label: "Self-Enumeration", active: false }, { label: "Review", active: false }, { label: "Complete", active: false }
                        ].map((step, i) => (
                            <div key={i} className="flex flex-col items-center bg-white px-4 z-10 mb-6 md:mb-0">
                                <div className={`w-10 h-10 rounded-full flex items-center justify-center mb-2 font-bold text-sm ${step.active ? 'bg-green-500 text-white' : 'bg-slate-100 text-slate-400 border-2 border-slate-200'}`}>
                                    {step.active ? <CheckCircle className="w-5 h-5" /> : i + 1}
                                </div>
                                <span className={`text-sm font-medium ${step.active ? 'text-slate-800' : 'text-slate-400'}`}>{step.label}</span>
                            </div>
                        ))}
                    </div>
                </div>
            </div>
        );

        function App() {
            const [currentRoute, setCurrentRoute] = useState('home');
            const [lang, setLang] = useState('en');
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

            const t = (key) => TRANSLATIONS[lang]?.[key] || TRANSLATIONS['en'][key] || key;

            const navigate = (route) => {
                setCurrentRoute(route);
                setMobileMenuOpen(false);
                window.scrollTo(0,0);
            };

            const navItems = [
                { id: 'home', label: t('nav_home'), icon: <Home className="w-4 h-4 mr-2" /> },
                { id: 'census-2027', label: t('nav_census'), icon: <Info className="w-4 h-4 mr-2" /> },
                { id: 'self-enumeration', label: t('nav_self_enum'), icon: <FileText className="w-4 h-4 mr-2" /> },
                { id: 'dates', label: t('nav_dates'), icon: <Calendar className="w-4 h-4 mr-2" /> },
                { id: 'data-explorer', label: t('nav_data'), icon: <BarChart2 className="w-4 h-4 mr-2" /> },
                { id: 'assistant', label: t('nav_ai'), icon: <MessageSquare className="w-4 h-4 mr-2" /> },
                { id: 'verify', label: t('nav_verify'), icon: <ShieldCheck className="w-4 h-4 mr-2" /> },
            ];

            const renderPage = () => {
                switch(currentRoute) {
                    case 'home': return <HomePage navigate={navigate} t={t} />;
                    case 'census-2027': return <CensusInfoPage />;
                    case 'self-enumeration': return <SelfEnumerationWizard navigate={navigate} />;
                    case 'dates': return <DatesPage />;
                    case 'data-explorer': return <DataExplorerPage />;
                    case 'assistant': return <AIAssistantPage />;
                    case 'verify': return <ClaimCheckerPage />;
                    case 'privacy': return <PrivacyPage />;
                    case 'dashboard': return <DashboardPage navigate={navigate} />;
                    default: return <HomePage navigate={navigate} t={t} />;
                }
            };

            return (
                <div className="flex flex-col min-h-screen">
                    <div className="bg-blue-950 text-blue-100 text-xs py-2 px-4 text-center font-medium">
                        <span className="inline-block md:hidden">Prototype App - Not an official Gov site</span>
                        <span className="hidden md:inline-block">{t('disclaimer')}</span>
                    </div>

                    <header className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 md:px-6 h-16 flex items-center justify-between">
                            <div className="flex items-center cursor-pointer" onClick={() => navigate('home')}>
                                <div className="w-8 h-8 bg-blue-900 rounded flex items-center justify-center mr-2 relative overflow-hidden">
                                   <div className="absolute top-0 left-0 w-full h-1 bg-orange-500"></div>
                                   <div className="absolute bottom-0 left-0 w-full h-1 bg-green-600"></div>
                                   <span className="text-white font-bold text-lg leading-none">C</span>
                                </div>
                                <span className="text-xl font-bold text-blue-950 tracking-tight">CensusSaathi<span className="text-orange-500">AI</span></span>
                            </div>

                            <nav className="hidden lg:flex items-center space-x-1">
                                {navItems.slice(0, 5).map(item => (
                                    <button key={item.id} onClick={() => navigate(item.id)} className={`px-3 py-2 rounded-md text-sm font-medium transition-colors ${currentRoute === item.id ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'}`}>
                                        {item.label}
                                    </button>
                                ))}
                            </nav>

                            <div className="hidden lg:flex items-center space-x-4">
                                <select value={lang} onChange={e => setLang(e.target.value)} className="bg-slate-50 border border-slate-200 text-sm rounded-md px-2 py-1 outline-none focus:ring-1 focus:ring-blue-500 cursor-pointer text-slate-700">
                                    <option value="en">English</option>
                                    <option value="hi">हिन्दी</option>
                                    <option value="mr">मराठी</option>
                                </select>
                                <Button variant="ghost" className="text-slate-600 px-3 py-1.5" onClick={() => navigate('dashboard')}>
                                    <User className="w-4 h-4 mr-2" /> {t('nav_dashboard')}
                                </Button>
                                <Button variant="primary" className="px-4 py-1.5 bg-orange-500 hover:bg-orange-600 text-sm shadow-sm" onClick={() => navigate('self-enumeration')}>
                                    {t('btn_start')}
                                </Button>
                            </div>

                            <button className="lg:hidden p-2 text-slate-600" onClick={() => setMobileMenuOpen(!mobileMenuOpen)}>
                                {mobileMenuOpen ? <X /> : <Menu />}
                            </button>
                        </div>

                        {mobileMenuOpen && (
                            <div className="lg:hidden absolute top-16 left-0 w-full bg-white border-b border-slate-200 shadow-lg px-4 py-4 flex flex-col space-y-2">
                                {navItems.map(item => (
                                    <button key={item.id} onClick={() => navigate(item.id)} className={`flex items-center w-full px-4 py-3 rounded-lg text-left text-sm font-medium ${currentRoute === item.id ? 'bg-blue-50 text-blue-700' : 'text-slate-700 hover:bg-slate-50'}`}>
                                        {item.icon} {item.label}
                                    </button>
                                ))}
                                <button onClick={() => navigate('privacy')} className="flex items-center w-full px-4 py-3 rounded-lg text-left text-sm font-medium text-slate-700 hover:bg-slate-50"><Shield className="w-4 h-4 mr-2"/> {t('nav_privacy')}</button>
                                <button onClick={() => navigate('dashboard')} className="flex items-center w-full px-4 py-3 rounded-lg text-left text-sm font-medium text-slate-700 hover:bg-slate-50"><User className="w-4 h-4 mr-2"/> {t('nav_dashboard')}</button>
                                <div className="pt-4 mt-2 border-t border-slate-100">
                                    <label className="block text-xs font-medium text-slate-500 mb-2 px-4">Select Language</label>
                                    <div className="flex px-4 gap-2">
                                        {['en', 'hi', 'mr'].map(l => (
                                            <button key={l} onClick={() => setLang(l)} className={`px-3 py-1.5 text-xs font-medium rounded border ${lang === l ? 'bg-blue-900 text-white border-blue-900' : 'bg-white text-slate-600 border-slate-300'}`}>
                                                {l === 'en' ? 'EN' : l === 'hi' ? 'हिंदी' : 'मराठी'}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </header>

                    <main className="flex-1">{renderPage()}</main>

                    <footer className="bg-slate-900 text-slate-400 py-10 px-6 border-t border-slate-800">
                        <div className="max-w-7xl mx-auto grid md:grid-cols-4 gap-8">
                            <div className="col-span-1 md:col-span-2">
                                <div className="flex items-center mb-4">
                                   <div className="w-6 h-6 bg-slate-700 rounded flex items-center justify-center mr-2"><span className="text-white font-bold text-xs">C</span></div>
                                   <span className="text-lg font-bold text-white tracking-tight">CensusSaathi<span className="text-orange-500">AI</span></span>
                                </div>
                                <p className="text-sm mb-4 max-w-sm">An independent GenAI-powered web application prototype designed to help Indian citizens understand and participate in Census 2027 securely and easily.</p>
                                <p className="text-xs border border-slate-700 inline-block p-2 rounded text-slate-300 bg-slate-800"><strong>Disclaimer:</strong> Not affiliated with the Govt. of India.</p>
                            </div>
                            <div>
                                <h4 className="text-white font-semibold mb-4">Quick Links</h4>
                                <ul className="space-y-2 text-sm">
                                    <li><button onClick={() => navigate('census-2027')} className="hover:text-white transition-colors">About Census 2027</button></li>
                                    <li><button onClick={() => navigate('self-enumeration')} className="hover:text-white transition-colors">Self-Enumeration</button></li>
                                    <li><button onClick={() => navigate('dates')} className="hover:text-white transition-colors">Important Dates</button></li>
                                </ul>
                            </div>
                            <div>
                                <h4 className="text-white font-semibold mb-4">Safety & Tools</h4>
                                <ul className="space-y-2 text-sm">
                                    <li><button onClick={() => navigate('privacy')} className="hover:text-white transition-colors">Privacy Policy</button></li>
                                    <li><button onClick={() => navigate('verify')} className="hover:text-white transition-colors">Claim Checker</button></li>
                                    <li><button onClick={() => navigate('assistant')} className="hover:text-white transition-colors">AI Assistant</button></li>
                                </ul>
                            </div>
                        </div>
                        <div className="max-w-7xl mx-auto mt-10 pt-6 border-t border-slate-800 text-xs text-center md:text-left flex flex-col md:flex-row justify-between">
                            <p>© 2026 CensusSaathi AI Prototype. All rights reserved.</p>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
